name: IntegrationTest
on:
  push:
    branches: [master]
    tags: [v*]
  pull_request:

jobs:
  test:
    name: ${{ matrix.package.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: [1]
        os: [ubuntu-latest]
        package:
          - {user: JuliaDiff, name: ChainRulesTestUtils}
          - {user: JuliaDiff, name: ChainRules}
          - {user: JuliaMath, name: SpecialFunctions}
          - {user: JuliaArrays, name: BlockDiagonals}
          - {user: invenia, name: PDMatsExtras}
          - {user: SciML, name: DataInterpolations}

    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
          arch: x64
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@latest
      - name: Clone Downstream
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.package.user }}/${{ matrix.package.name }}.jl
          path: downstream
      - name: Load this and run the downstream tests
        shell: julia --project=@temp {0}
        run: |
          using Pkg
          try
            # force it to use this PR's version of the package
            Pkg.develop([PackageSpec(path="."), PackageSpec(path="downstream")])  # ResolverError with main deps may be thrown here
            Pkg.update()
            Pkg.test("${{ matrix.package.name }}")  # ResolverError with test deps may be thrown here (before test process starts)
          catch err
            err isa Pkg.Resolve.ResolverError || rethrow()
            # If we can't resolve that means this is incompatible by SemVer and this is fine
            # It means we marked this as a breaking change, so we don't need to worry about
            # Mistakenly introducing a breaking change, as we have intentionally made one

            @info "Not compatible with this release. No problem." exception=err
            exit(0)  #  Exit immediately, as a success
          end
